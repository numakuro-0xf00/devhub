name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' src/Devhub.Tool/Devhub.Tool.csproj)"
          echo "tag=${GITHUB_REF_NAME} (parsed version: ${TAG_VERSION})"
          echo "csproj Version=${CSPROJ_VERSION}"
          if [ "${TAG_VERSION}" != "${CSPROJ_VERSION}" ]; then
            echo "::error::タグ '${GITHUB_REF_NAME}' が指すバージョン '${TAG_VERSION}' が" \
                 "src/Devhub.Tool/Devhub.Tool.csproj の <Version>${CSPROJ_VERSION}</Version> と一致しません。" \
                 "タグを打ち直すか csproj の Version を更新してください。"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Devhub.Tool --configuration Release --no-build -o ./nupkg

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
