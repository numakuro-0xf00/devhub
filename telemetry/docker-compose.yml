# devhub telemetry 収集基盤(doc/phase2.md Step 3)。
#
# 起動: telemetry/.env を用意してから `docker compose up -d`(手順は telemetry/README.md)。
# 全イメージはバージョンタグでピン留めしている(2026-07 時点の安定版。latest は使わない)。
#
#   otel/opentelemetry-collector-contrib : 0.156.0  (2026-07-07 リリース)
#   prom/prometheus                      : v3.13.1  (3.13 LTS 系の最新パッチ、2026-07-10)
#   grafana/loki                         : 3.7.3    (2026-06-24)
#   grafana/grafana                      : 13.1.0   (2026-07-01)

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    env_file:
      - .env
    ports:
      # devhub telemetry send --> DEVHUB_TELEMETRY_ENDPOINT (webhookevent receiver)
      - "8088:8088"
      # prometheus exporter の /metrics (通常は同一 compose network 内の prometheus からのみ scrape されるが、
      # 契約テスト・手元確認のためホストにも公開しておく)
      - "8889:8889"
    networks:
      - devhub-telemetry

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 「未使用検出」の PromQL が increase(...[Nd]) で長い窓を参照するため、既定閾値(30日)より
      # 十分長く保持する(doc/phase2.md「方針の外出し」。Loki の90日保持とは別軸で、こちらは
      # メトリクスの保持期間なので余裕を持たせる)。
      - --storage.tsdb.retention.time=180d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - devhub-telemetry

  loki:
    image: grafana/loki:3.7.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - devhub-telemetry

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${DEVHUB_TELEMETRY_GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # analytics: 匿名化方針(NFR-2)を Grafana 自身にも適用し、Grafana 社への使用状況送信を止める。
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    env_file:
      - .env
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - devhub-telemetry

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  devhub-telemetry:
