# devhub telemetry 収集基盤 — Grafana datasource provisioning(doc/phase2.md Step 3)。
# uid を固定しておき、telemetry/grafana/dashboards/*.json から uid 参照で datasource を特定できるようにする
# (Grafana の「ダッシュボードインポート」フロー(__inputs / DS_* 変数)は使わず、provisioning 前提で決め打つ)。
#
# 参照: https://grafana.com/docs/grafana/latest/administration/provisioning/

apiVersion: 1

datasources:
  - name: Prometheus
    uid: devhub-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: devhub-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
